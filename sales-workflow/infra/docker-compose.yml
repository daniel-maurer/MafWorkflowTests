services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: maf-sales-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_admin
      POSTGRES_USER: maf_admin
      POSTGRES_PASSWORD: maf_dev_2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maf_admin -d sales_admin"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
