<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Brand & Category Header -->
  <text x="32" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">STYLECO • VESTUÁRIO</text>
  <rect x="290" y="28" width="78" height="24" rx="12" fill="#22c55e" fill-opacity="0.2"/>
  <text x="329" y="44" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">EM ESTOQUE</text>

  <!-- Shirt Illustration -->
  <g transform="translate(100, 60)">
    <!-- Collar & Shoulders -->
    <path d="M 40 50 L 70 30 L 100 45 L 130 30 L 160 50 L 190 90 L 160 110 L 150 90 L 150 210 L 50 210 L 50 90 L 40 110 L 10 90 Z" fill="url(#shirt)" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))"/>
    <!-- Collar Detail -->
    <path d="M 70 30 L 100 75 L 130 30" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 100 75 L 100 120" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="90" r="3" fill="#ffffff"/>
    <circle cx="100" cy="105" r="3" fill="#ffffff"/>
    <!-- Pocket -->
    <rect x="62" y="100" width="24" height="28" rx="4" fill="url(#accent)" stroke="#93c5fd" stroke-width="1.5"/>
  </g>

  <!-- Product Details Footer -->
  <rect x="24" y="280" width="352" height="96" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="312" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Camiseta Polo Clássica</text>
  <text x="44" y="334" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Algodão Pima • Tam M • Azul</text>
  <text x="44" y="360" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">R$ 129,90</text>
  <text x="160" y="360" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">10x R$ 12,99</text>
</svg>
