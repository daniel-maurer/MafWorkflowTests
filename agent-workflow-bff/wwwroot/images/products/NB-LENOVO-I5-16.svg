<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_nb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screen_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="24" fill="url(#bg_nb)"/>
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Brand & Category Header -->
  <text x="32" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">LENOVO • INFORMÁTICA</text>
  <rect x="290" y="28" width="78" height="24" rx="12" fill="#22c55e" fill-opacity="0.2"/>
  <text x="329" y="44" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">EM ESTOQUE</text>

  <!-- Laptop Illustration -->
  <g transform="translate(65, 55)">
    <!-- Screen Bezel -->
    <rect x="35" y="25" width="200" height="135" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Screen Display with Colorful Gradient -->
    <rect x="42" y="32" width="186" height="115" rx="4" fill="url(#screen_glow)"/>
    <!-- Screen Content / Code Lines -->
    <rect x="55" y="45" width="70" height="6" rx="3" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="55" y="58" width="120" height="4" rx="2" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="55" y="68" width="90" height="4" rx="2" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="55" y="78" width="105" height="4" rx="2" fill="#ffffff" fill-opacity="0.5"/>
    <!-- Webcam dot -->
    <circle cx="135" cy="28.5" r="2" fill="#64748b"/>

    <!-- Base / Keyboard Deck -->
    <path d="M 15 160 L 255 160 L 270 185 L 0 185 Z" fill="url(#metal)" stroke="#334155" stroke-width="1.5"/>
    <!-- Trackpad -->
    <rect x="110" y="166" width="50" height="15" rx="3" fill="#334155" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Product Details Footer -->
  <rect x="24" y="280" width="352" height="96" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="312" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Lenovo IdeaPad 3i</text>
  <text x="44" y="334" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Intel Core i5 • 16GB RAM • SSD 512GB • 15.6" FHD</text>
  <text x="44" y="360" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">R$ 3.499,00</text>
  <text x="175" y="360" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">10x R$ 349,90 sem juros</text>
</svg>
