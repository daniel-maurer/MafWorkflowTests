<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_jbl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="headband" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="24" fill="url(#bg_jbl)"/>
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Brand & Category Header -->
  <text x="32" y="44" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">JBL • ÁUDIO</text>
  <rect x="282" y="28" width="86" height="24" rx="12" fill="#ef4444" fill-opacity="0.2"/>
  <text x="325" y="44" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ESGOTADO</text>

  <!-- Headphones Illustration -->
  <g transform="translate(100, 50)">
    <!-- Headband Arch -->
    <path d="M 30 140 C 30 40, 170 40, 170 140" fill="none" stroke="url(#headband)" stroke-width="16" stroke-linecap="round" filter="drop-shadow(0 8px 12px rgba(0,0,0,0.4))"/>
    <path d="M 45 100 C 55 55, 145 55, 155 100" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Ear Cup -->
    <rect x="15" y="120" width="32" height="60" rx="16" fill="url(#cup)" stroke="#93c5fd" stroke-width="2"/>
    <ellipse cx="31" cy="150" rx="8" ry="20" fill="#1e293b"/>

    <!-- Right Ear Cup -->
    <rect x="153" y="120" width="32" height="60" rx="16" fill="url(#cup)" stroke="#93c5fd" stroke-width="2"/>
    <ellipse cx="169" cy="150" rx="8" ry="20" fill="#1e293b"/>

    <!-- JBL Logo on ear cup -->
    <text x="31" y="154" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" text-anchor="middle">JBL</text>
    <text x="169" y="154" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" text-anchor="middle">JBL</text>
  </g>

  <!-- Product Details Footer -->
  <rect x="24" y="280" width="352" height="96" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="312" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Fone JBL Tune 510BT</text>
  <text x="44" y="334" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Bluetooth 5.0 • Pure Bass • Bateria até 40h</text>
  <text x="44" y="360" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">R$ 199,90</text>
  <text x="160" y="360" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">Avise-me quando chegar</text>
</svg>
